# ==================== 数据库配置 ====================
spring.datasource.url=jdbc:mysql://localhost:3306/geo?characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC&autoReconnect=true&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=513023huangwei
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== JPA / Hibernate 配置 ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==================== LLM 配置 (Ollama 本地大模型) ====================
llm.provider=ollama
ollama.base-url=http://localhost:11434
ollama.model=qwen3
# 0=模型永不卸载，避免每次请求重新加载(默认5分钟闲置即卸载)
ollama.keep-alive=0
# 启动时预热，强制首次加载模型到内存
ollama.warmup=true

# ==================== JWT 配置 ====================
jwt.secret=GeoAdminSecretKeyForJWT2024PleaseChangeInProduction
jwt.expiration=86400000

# ==================== Playwright 浏览器自动化配置 ====================
# 连接用户当前打开的 Edge 浏览器（通过 CDP），保留所有登录态和 Cookie
# 首次运行时会自动启动 Edge 并开启远程调试端口 9222
acquisition.playwright.channel=msedge
acquisition.playwright.headless=false
acquisition.playwright.anti-detection.enabled=true
acquisition.playwright.human-delay-min-ms=300
acquisition.playwright.human-delay-max-ms=2000
acquisition.playwright.max-retry=2
acquisition.playwright.comment-extract-timeout-seconds=120

# ==================== 抖音获客屏幕自动化配置 (已废弃，使用 Playwright) ====================
# douyin.acquisition.template-dir=automation-templates/douyin
# douyin.acquisition.match-threshold=0.88
# douyin.acquisition.match-step=3

# ==================== 抖音批量私信发送配置 ====================
# 每条消息发送后的等待(ms)，越小越快但越容易触发风控 — 建议 ≥ 200
acquisition.douyin.message.delay-ms=250
# 页面导航超时(ms)
acquisition.douyin.message.navigation-timeout-ms=6000
# 搜索结果出现超时(ms)
acquisition.douyin.message.search-result-timeout-ms=3000
# 用户主页加载超时(ms)
acquisition.douyin.message.profile-timeout-ms=3000
# 聊天对话框打开超时(ms)
acquisition.douyin.message.chat-dialog-timeout-ms=3000
# 消息填入后到发送前的延迟(ms)
acquisition.douyin.message.pre-send-delay-ms=150
# 用户间冷却间隔(ms)，防止被限流 — 建议 ≥ 500
acquisition.douyin.message.inter-user-delay-ms=500

# ==================== AI 相关性过滤配置 ====================
# 是否启用后端 AI 语义相关性检查（Ollama），对采集到的视频标题进行二次过滤
# 默认 false，优先依赖前端脚本的文本匹配；开启后会在保存前用 AI 再次确认
acquisition.relevance-filter.enabled=false
# AI 判断为相关的最低分数阈值 (0.0-1.0)
acquisition.relevance-filter.min-score=0.5
# 每批次最大 AI 调用次数（按唯一标题去重后）
acquisition.relevance-filter.max-batch=10
